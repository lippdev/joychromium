name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  electron:
    name: electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: End-to-end (real Electron, Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      # The two time budgets of the PRD, section 11, as the e2e measured them on this runner. It prints on every run,
      # so a slow machine leaves a number in the log instead of a mystery; the file rides along in the job artifact.
      - name: Section 11 metrics (measured by the e2e)
        if: always()
        run: >-
          node -e "const fs=require('fs');const p='test-results/metrics.json';
          if(!fs.existsSync(p)){console.log('no metrics.json: the e2e did not reach the metrics spec');process.exit(0);}
          for(const m of JSON.parse(fs.readFileSync(p,'utf8')).measured)
          console.log(m.name + ': ' + m.valueMs + ' ms (goal ' + m.goalMs + ' ms, fails above ' + m.limitMs + ' ms)')"
      - name: Package (no publish) to prove the installers build
        run: npm run build && npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the installed package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-x64.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Programs\JoyChromium\JoyChromium.exe'
          if (-not (Test-Path $app)) { Write-Error "The installer did not create $app"; exit 1; }
          $profile = Join-Path $env:RUNNER_TEMP "smoke-joychromium"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          '{"onboardingCompleted":true,"startup":"NewTab","windowMode":"window"}' | Set-Content (Join-Path $profile 'settings.json')
          $env:JOYCHROMIUM_DATA = $profile
          $process = Start-Process -FilePath $app -PassThru
          $started = $false
          for ($i = 0; $i -lt 40; $i++) {
            $log = Get-ChildItem (Join-Path $profile 'logs') -Filter *.log -ErrorAction SilentlyContinue
            if ($log -and (Select-String -Path $log.FullName -Pattern 'starting' -Quiet)) { $started = $true; break }
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem (Join-Path $profile 'logs') -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -TotalCount 1 }
          if (-not $started) { Write-Error 'The installed app never started'; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.zip
            app/test-results/metrics.json
          if-no-files-found: ignore
