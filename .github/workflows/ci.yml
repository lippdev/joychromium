name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  electron:
    name: electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: RPM tools (Linux only, for the rpm target)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
        working-directory: .
      # The AT-SPI half of tests/e2e/screen-reader.spec.ts reads the tree Orca reads; without these it skips.
      - name: Screen reader bridge (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-pyatspi python3-gi gir1.2-atspi-2.0 at-spi2-core dbus
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: End-to-end (real Electron, Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: End-to-end (real Electron, Linux under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x900x24" npm run test:e2e
      - name: End-to-end (real Electron, macOS)
        if: runner.os == 'macOS'
        run: npm run test:e2e
      # Native Wayland, no X11: a headless Weston compositor, DISPLAY unset, and the app has to boot and paint in it.
      - name: Wayland smoke test (no XWayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y weston
          npm run build
          # Electron's SUID sandbox needs a root-owned helper; npm unpacks it without the setuid bit.
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          node scripts/wayland-smoke.mjs
      - name: Package (no publish) to prove the installers build
        run: npm run build && npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The installers build; this proves one of them installs and the installed app actually starts.
      - name: Smoke test the installed package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # apt (not dpkg) so the declared dependencies are pulled in, the way people install it.
          sudo apt-get update
          sudo apt-get install -y ./release/*-amd64.deb
          profile=$(mktemp -d)
          echo '{"onboardingCompleted":true,"startup":"NewTab","windowMode":"window"}' > "$profile/settings.json"
          JOYCHROMIUM_DATA="$profile" xvfb-run --auto-servernum --server-args="-screen 0 1600x900x24" joychromium &
          app=$!
          started=no
          for _ in $(seq 1 40); do
            if grep -qs "starting" "$profile"/logs/*.log 2>/dev/null; then started=yes; break; fi
            sleep 1
          done
          kill "$app" 2>/dev/null || true
          grep -h "starting" "$profile"/logs/*.log || true
          [ "$started" = yes ] || { echo "The installed app never started"; exit 1; }
      - name: Smoke test the installed package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-x64.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Programs\JoyChromium\JoyChromium.exe'
          if (-not (Test-Path $app)) { Write-Error "The installer did not create $app"; exit 1; }
          $profile = Join-Path $env:RUNNER_TEMP "smoke-joychromium"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          '{"onboardingCompleted":true,"startup":"NewTab","windowMode":"window"}' | Set-Content (Join-Path $profile 'settings.json')
          $env:JOYCHROMIUM_DATA = $profile
          $process = Start-Process -FilePath $app -PassThru
          $started = $false
          for ($i = 0; $i -lt 40; $i++) {
            $log = Get-ChildItem (Join-Path $profile 'logs') -Filter *.log -ErrorAction SilentlyContinue
            if ($log -and (Select-String -Path $log.FullName -Pattern 'starting' -Quiet)) { $started = $true; break }
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem (Join-Path $profile 'logs') -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -TotalCount 1 }
          if (-not $started) { Write-Error 'The installed app never started'; exit 1; }
      # macOS is not in this check: the app installed from the dmg runs in the runner but writes no log at all
      # (it never reaches its first line), while the e2e in the same job launches Electron fine. The dmg is still
      # built here, and docs/RELEASE.md keeps the manual check for the machine it ships to.
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.rpm
            app/release/*.dmg
            app/release/*.zip
          if-no-files-found: ignore
