name: Release

# Two ways in:
#   1. A push to main whose commit bumped Electron (Dependabot's "chore(deps): bump electron ...") — patch bump.
#   2. A manual dispatch with an optional exact SemVer version or a bump level.
# Versions advance from published GitHub Releases, never historic tags. Windows builds with that version injected,
# then installers + update metadata go to a GitHub Release
# and installed apps pick it up through electron-updater. Anything below 1.0 is published as a pre-release: 0.x builds
# are for trying out, not for the `latest` channel an installed app follows.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact SemVer version (optional; defaults to the package version on a clean release reset)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: decide
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$MESSAGE" | grep -qiE '^chore\(deps\): bump electron '; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.decide.outputs.release == 'true'
        with:
          fetch-depth: 0
      - id: version
        if: steps.decide.outputs.release == 'true'
        env:
          BUMP: ${{ steps.decide.outputs.bump }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft | not)][0].tagName // ""')
          CURRENT=$(node -p 'require("./app/package.json").version')
          CURRENT_VERSION="$CURRENT" LATEST_RELEASE_VERSION="$LATEST" node app/scripts/release-version.mjs
          echo "Selected release version from latest published release '${LATEST:-none}' (bump: $BUMP)"

  tag:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag the release commit
        run: |
          git config user.name "joychromium-bot"
          git config user.email "bot@users.noreply.github.com"
          git tag -a "v${{ needs.decide.outputs.version }}" -m "JoyChromium ${{ needs.decide.outputs.version }}"
          git push origin "v${{ needs.decide.outputs.version }}"
      # electron-builder uploads each architecture in parallel; with no release to find, each upload creates its own and
      # the tag ends up with two. This draft is the one release they all upload to; `notes` publishes it.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ needs.decide.outputs.version }}" --draft --verify-tag --title "${{ needs.decide.outputs.version }}" --notes ""

  build:
    needs: [decide, tag]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.decide.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: EVS client (VMP signing)
        run: python -m pip install --upgrade castlabs-evs
      - name: EVS account present?
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
        run: |
          if [ -n "$EVS_ACCOUNT_NAME" ]; then
            echo "EVS account: present — this build signs the CDM (docs/DRM-EVS.md)"
          else
            echo "EVS account: missing — this build ships an unverifiable CDM (docs/DRM-EVS.md)"
          fi
      - run: npm test
      - name: Stamp the version into the package (not committed; the tag is the source of truth)
        run: npm version ${{ needs.decide.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Build and publish installers
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_PRE_RELEASE: ${{ needs.decide.outputs.prerelease }}
          # The VMP hook (app/scripts/after-pack.mjs) signs the CDM when these exist and logs the reason when they do
          # not; the EVS client reads them from the environment so they never reach a command line or the build log.
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  notes:
    needs: [decide, build]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compose the release notes from the commits since the previous tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.decide.outputs.version }}
          PRERELEASE: ${{ needs.decide.outputs.prerelease }}
        run: |
          previous_release=$(gh release list --limit 100 --json tagName,isDraft --jq "[.[] | select((.isDraft | not) and .tagName != env.VERSION)][0].tagName // \"\"")
          previous=${previous_release:-}
          echo "Notas de ${previous:-o começo} até $VERSION"
          git log --no-merges --pretty=format:%s "${previous:+$previous..}$VERSION" \
            | node app/scripts/release-notes.mjs "${previous:-}" "${VERSION#v}" > notes.md
          # Alpha and other prerelease builds stay out of the installed app's latest update channel.
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$VERSION" --notes-file notes.md --draft=false --prerelease --latest=false
          else
            gh release edit "$VERSION" --notes-file notes.md --draft=false
          fi
