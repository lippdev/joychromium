name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet tool install -g vpk
      - run: dotnet publish JoyChromium.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=${{ env.VERSION }}
      - run: dotnet test tests/JoyChromium.Tests -c Release
      - name: Pack
        run: vpk pack -u JoyChromium -v ${{ env.VERSION }} -p publish -e JoyChromium.exe --packTitle JoyChromium --packAuthors lippdev
      - name: Publish to GitHub Releases
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --publish --releaseName "JoyChromium ${{ env.VERSION }}" --tag ${{ github.ref_name }}
