name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Cache uBlock Origin download
        uses: actions/cache@v4
        with:
          path: Assets/extensions
          key: ublock-${{ hashFiles('JoyChromium.csproj') }}
      - run: dotnet restore JoyChromium.csproj
      - run: dotnet format JoyChromium.csproj --verify-no-changes --no-restore
      - run: dotnet build JoyChromium.csproj --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/JoyChromium.Tests --configuration Release --logger "console;verbosity=normal"
      - run: dotnet build tools/PolicySigner --configuration Release
      - run: dotnet build tests/UiSmoke --configuration Release
      - name: UI smoke
        run: dotnet run --project tests/UiSmoke --configuration Release --no-build -- bin/Release/net8.0-windows10.0.19041.0/JoyChromium.exe

  electron:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: End-to-end (real Electron)
        run: npm run test:e2e
