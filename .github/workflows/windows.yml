name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore JoyChromium.csproj
      - run: dotnet build JoyChromium.csproj --configuration Release --no-restore
      - run: dotnet run --project tests/TvIdentity.Smoke.csproj --configuration Release
