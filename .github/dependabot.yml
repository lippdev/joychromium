version: 2
updates:
  # The engine (castLabs Electron for Content Security) is published on GitHub releases and not on npm, so it is
  # updated by .github/workflows/engine-update.yml instead of Dependabot.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Everything except Electron is grouped so the queue stays readable; Electron gets its own PR (it triggers a release).
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["electron", "@electron/fuses", "preact", "esbuild"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
