version: 2
updates:
  # The Electron shell. Chromium security fixes arrive as Electron patch releases; checking daily keeps the lag to hours.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Everything except Electron is grouped so the queue stays readable; Electron gets its own PR (it triggers a release).
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["electron"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
