<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Favorites</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="list.css">
</head>
<body>
<main>
  <h1>Favorites</h1>
  <p class="lead">Press the ★ button (or <kbd>Ctrl+D</kbd>, or hold <kbd>LB</kbd> and press <kbd>Y</kbd>) on any page to keep it here. Favorites also appear on the new tab page.</p>
  <div class="bar"><input id="q" placeholder="Filter favorites" autofocus autocomplete="off"></div>
  <div id="list"></div>
</main>
<script src="list.js"></script>
<script>
  let all = [];
  const draw = () => {
    const q = $('q').value.trim().toLowerCase();
    renderList($('list'), all.filter(f => !q || f.title.toLowerCase().includes(q) || f.url.toLowerCase().includes(q)),
      { removeType: 'favorite-remove', emptyText: all.length ? 'Nothing matches.' : 'No favorites yet.' });
  };
  $('q').addEventListener('input', draw);
  window.joy.onMessage(msg => {
    if (msg.type !== 'init') return;
    paint(msg.theme);
    all = (msg.favorites || []).map(f => ({ title: f.name, url: f.url }));
    draw();
  });
  post('ready', {});
</script>
</body>
</html>
