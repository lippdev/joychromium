<!doctype html>
<!-- The controller's pointer, alone in a transparent click-through window above the shell and every tab view, so no layer
     of the app can cover it. spatial.js brings the same arrow and hand and the same glide the pages use. -->
<html>
<head><meta charset="utf-8"><style>html, body { margin: 0; background: transparent; overflow: hidden; }</style></head>
<body><script src="spatial.js"></script></body>
</html>
