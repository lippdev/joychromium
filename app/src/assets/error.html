<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Não foi possível abrir esta página</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="pages.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: var(--space-5); }
  .card { width: min(calc(720 * var(--u)), 100%); padding: var(--space-6); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
  h1 { margin: 0 0 var(--space-2); font-size: var(--text-xl); }
  p { margin: 0 0 var(--space-3); color: var(--muted); }
  code { color: var(--text); word-break: break-all; }
  .actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-5); }
  .warn { background: transparent; color: var(--danger); border: 1px solid var(--danger); min-height: calc(44 * var(--u)); padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Não foi possível abrir esta página</h1>
  <p><code id="url"></code></p>
  <p id="reason"></p>
  <p id="httpsNote" hidden>O JoyChromium tentou primeiro a versão segura (https) e ela não respondeu. Abrir em http não é privado: qualquer pessoa na rede pode ler ou alterar o que você vê.</p>
  <div class="actions">
    <button class="primary" id="retry" autofocus>Tentar de novo</button>
    <button class="ghost" id="home">Ir para o início</button>
    <button class="warn" id="http" hidden>Abrir em http mesmo assim</button>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const url = q.get('url') || '', reason = q.get('reason') || '', upgraded = q.get('upgraded') === '1';
  const $ = id => document.getElementById(id);
  const post = (type, payload) => { try { window.joy.post({ type, ...payload }); } catch (_) {} };
  $('url').textContent = url;
  $('reason').textContent = reason ? `Motivo: ${reason}` : '';
  if (upgraded) { $('title').textContent = 'Sem conexão segura'; $('httpsNote').hidden = false; $('http').hidden = false; }
  $('retry').addEventListener('click', () => post('navigate', { url: upgraded ? url.replace(/^http:/, 'https:') : url }));
  $('home').addEventListener('click', () => post('navigate', { url: 'joychromium://newtab' }));
  $('http').addEventListener('click', () => post('navigate', { url, allowHttp: true }));
  window.joy.onMessage(msg => {
    if (msg.type !== 'init') return;
    const t = msg.theme, r = document.documentElement.style;
    r.setProperty('--accent', t.accent); r.setProperty('--bg', t.background); r.setProperty('--surface', t.surface); r.setProperty('--text', t.text);
  });
  post('ready', {});
</script>
</body>
</html>
