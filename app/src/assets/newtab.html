<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>JoyChromium</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<main>
  <section class="hero">
    <div class="logo"><img src="logo.png" alt=""><span>Joy<b>Chromium</b></span></div>
    <form id="search" class="search" role="search" data-i18n-aria-label="a11y.search" aria-label="Pesquisar">
      <input id="q" autofocus autocomplete="off" spellcheck="false" data-i18n-placeholder="home.search" data-i18n-aria-label="a11y.search" aria-label="Pesquisar" placeholder="Pesquisar ou digitar um endereço">
      <button class="go" type="submit" data-i18n="input.ok">OK</button>
    </form>
    <p class="engine" id="engine"></p>
  </section>

  <!-- Only the user's own sites: shortcuts they added, then favorites, then what they opened lately. -->
  <div class="tiles" id="sites" role="list" data-i18n-aria-label="home.sites" aria-label="Acesso rápido" hidden></div>

  <footer>
    <span data-i18n="home.hint">Y abre o teclado · D-pad move · A seleciona</span>
    <a href="joychromium://favorites" id="fav" data-i18n="home.favorites">Favoritos</a>
    <a href="joychromium://history" id="hist" data-i18n="home.history">Histórico</a>
    <a href="joychromium://settings" id="settings" data-i18n="menu.settings">Configurações</a>
  </footer>
</main>
<script src="i18n.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const post = (type, payload) => { try { window.joy.post({ type, ...payload }); } catch (_) {} };

  for (const id of ['fav', 'hist', 'settings']) {
    $(id).addEventListener('click', (e) => { e.preventDefault(); post('navigate', { url: e.currentTarget.getAttribute('href') }); });
  }
  $('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const value = $('q').value.trim();
    if (value) post('navigate', { url: value });
  });

  const MAX_TILES = 8;
  let pinned = [];
  let recent = [];

  function card(name, url) {
    const b = document.createElement('button');
    b.className = 'card';
    b.title = url;
    const badge = document.createElement('i');
    // The initial is decoration: the button is named by the title alone, not "Y YouTube TV".
    badge.setAttribute('aria-hidden', 'true');
    badge.textContent = name.trim()[0]?.toUpperCase() ?? '?';
    const label = document.createElement('span');
    label.textContent = name;
    b.append(badge, label);
    b.addEventListener('click', () => post('navigate', { url }));
    const item = document.createElement('div');
    item.className = 'card-item';
    item.setAttribute('role', 'listitem');
    item.append(b);
    return item;
  }

  window.joy.onMessage((msg) => {
    if (msg.type === 'init') {
      i18n.set(msg.dictionary, msg.language);
      const t = msg.theme, r = document.documentElement.style;
      r.setProperty('--accent', t.accent);
      r.setProperty('--bg', t.background);
      r.setProperty('--surface', t.surface);
      r.setProperty('--text', t.text);
      const v = parseInt(t.accent.slice(1), 16);
      r.setProperty('--accent-text', (0.2126 * (v >> 16 & 255) + 0.7152 * (v >> 8 & 255) + 0.0722 * (v & 255)) / 255 > 0.45 ? '#0A0F1A' : '#FFFFFF');
      $('engine').textContent = `${msg.searchEngine.name}`;
      pinned = [...msg.shortcuts, ...(msg.favorites || [])];
      render();
    }
    if (msg.type === 'history' && Array.isArray(msg.entries)) {
      recent = msg.entries.map((e) => ({ name: e.title || e.url, url: e.url }));
      render();
    }
  });

  function render() {
    const seen = new Set();
    const sites = [...pinned, ...recent].filter((s) => !seen.has(s.url) && seen.add(s.url)).slice(0, MAX_TILES);
    $('sites').hidden = sites.length === 0;
    $('sites').replaceChildren(...sites.map((s) => card(s.name, s.url)));
  }
  post('ready', {});
  post('history-search', { query: '' });
</script>
</body>
</html>
