<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>JoyChromium</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<main>
  <section class="hero">
    <div class="logo"><img src="logo.png" alt=""><span>Joy<b>Chromium</b></span></div>
    <form id="search" class="search" role="search" data-i18n-aria-label="a11y.search" aria-label="Pesquisar">
      <input id="q" autofocus autocomplete="off" spellcheck="false" data-i18n-placeholder="home.search" data-i18n-aria-label="a11y.search" aria-label="Pesquisar" placeholder="Pesquisar ou digitar um endereço">
      <button class="go" type="submit" data-i18n-aria-label="a11y.search" aria-label="Pesquisar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21.85 12.5a.55.55 0 0 0 0-1L3.4 3.6a.55.55 0 0 0-.76.62L4.6 11 13 12l-8.4 1-1.96 6.78a.55.55 0 0 0 .76.62Z"/></svg></button>
    </form>
    <p class="engine" id="engine"></p>
  </section>

  <!-- Only the user's own sites: shortcuts they added, then favorites, then what they opened lately. -->
  <div class="tiles" id="sites" role="list" data-i18n-aria-label="home.sites" aria-label="Acesso rápido" hidden></div>

  <footer>
    <span data-i18n="home.hint">Y abre o teclado · D-pad move · A seleciona</span>
    <a href="joychromium://favorites" id="fav" data-i18n="home.favorites">Favoritos</a>
    <a href="joychromium://history" id="hist" data-i18n="home.history">Histórico</a>
    <a href="joychromium://settings" id="settings" data-i18n="menu.settings">Configurações</a>
  </footer>
</main>
<script src="i18n.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const post = (type, payload) => { try { window.joy.post({ type, ...payload }); } catch (_) {} };

  for (const id of ['fav', 'hist', 'settings']) {
    $(id).addEventListener('click', (e) => { e.preventDefault(); post('navigate', { url: e.currentTarget.getAttribute('href') }); });
  }
  $('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const value = $('q').value.trim();
    if (value) post('navigate', { url: value });
  });

  const MAX_TILES = 8;
  let pinned = [];
  let recent = [];
  let showSites = true;

  // The site's own icon, kept inside the app; the initial in the circle stays until an icon loads (or when there is none).
  let refreshed = 0;
  let faviconKey = '';
  const hostOf = (url) => { try { const u = new URL(url); return u.protocol === 'https:' || u.protocol === 'http:' ? u.hostname : ''; } catch { return ''; } };

  function card(name, url) {
    const b = document.createElement('button');
    b.className = 'card';
    b.title = url;
    const badge = document.createElement('i');
    // The initial is decoration: the button is named by the title alone, not "Y YouTube TV".
    badge.setAttribute('aria-hidden', 'true');
    // The letter is its own text node, so taking it away when the icon arrives leaves the icon in place.
    const letter = document.createTextNode(name.trim()[0]?.toUpperCase() ?? '?');
    badge.append(letter);
    const host = hostOf(url);
    if (host) {
      const icon = document.createElement('img');
      icon.alt = '';
      icon.addEventListener('load', () => { letter.remove(); badge.classList.add('has-icon'); });
      icon.addEventListener('error', () => icon.remove());
      icon.src = `joychromium://favicon/?host=${encodeURIComponent(host)}&k=${faviconKey}&r=${refreshed}`;
      badge.append(icon);
    }
    const label = document.createElement('span');
    label.textContent = name;
    b.append(badge, label);
    b.addEventListener('click', () => post('navigate', { url }));
    const item = document.createElement('div');
    item.className = 'card-item';
    item.setAttribute('role', 'listitem');
    item.append(b);
    return item;
  }

  window.joy.onMessage((msg) => {
    if (msg.type === 'init') {
      i18n.set(msg.dictionary, msg.language);
      const t = msg.theme, r = document.documentElement.style;
      r.setProperty('--accent', t.accent);
      r.setProperty('--bg', t.background);
      r.setProperty('--surface', t.surface);
      r.setProperty('--text', t.text);
      const v = parseInt(t.accent.slice(1), 16);
      r.setProperty('--accent-text', (0.2126 * (v >> 16 & 255) + 0.7152 * (v >> 8 & 255) + 0.0722 * (v & 255)) / 255 > 0.45 ? '#0A0F1A' : '#FFFFFF');
      $('engine').textContent = `${msg.searchEngine.name}`;
      document.body.dataset.bg = msg.newTabBackground || 'Wallpaper';
      faviconKey = msg.faviconKey || '';
      const b = parseInt(t.background.slice(1), 16);
      document.body.dataset.tone = (0.2126 * (b >> 16 & 255) + 0.7152 * (b >> 8 & 255) + 0.0722 * (b & 255)) / 255 > 0.5 ? 'light' : 'dark';
      showSites = msg.newTabSites !== false;
      pinned = [...msg.shortcuts, ...(msg.favorites || [])];
      render();
    }
    if (msg.type === 'favicons') {
      // Icons arrived for sites that had none: draw the tiles again so those load.
      refreshed += 1;
      render();
    }
    if (msg.type === 'history' && Array.isArray(msg.entries)) {
      recent = msg.entries.map((e) => ({ name: e.title || e.url, url: e.url }));
      render();
    }
  });

  function render() {
    // The user's own shortcuts and favorites always show; a recent page is left out when its site is already there, so a
    // site is one tile whatever page of it was opened last.
    const siteOf = (url) => hostOf(url).replace(/^www\./, '') || url;
    const urls = new Set();
    const own = pinned.filter((s) => !urls.has(s.url) && urls.add(s.url));
    const taken = new Set(own.map((s) => siteOf(s.url)));
    const later = recent.filter((s) => !taken.has(siteOf(s.url)) && taken.add(siteOf(s.url)));
    const sites = [...own, ...later].slice(0, MAX_TILES);
    $('sites').hidden = !showSites || sites.length === 0;
    $('sites').replaceChildren(...sites.map((s) => card(s.name, s.url)));
    // Sites with no icon kept yet (visited before icons were saved, or only added by hand): ask for them once.
    const wanted = [...new Set(sites.map((s) => hostOf(s.url)).filter((h) => h && !asked.has(h)))];
    for (const h of wanted) asked.add(h);
    if (wanted.length) post('favicon-fetch', { hosts: wanted });
  }
  const asked = new Set();
  post('ready', {});
  post('history-search', { query: '' });
</script>
</body>
</html>
