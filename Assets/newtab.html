<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent: #64DDB5; --bg: #0C0E13; --surface: #14171E; --text: #F3F5F9; --accent-text: #07120F;
    --muted: color-mix(in srgb, var(--text) 70%, var(--surface)); --border: color-mix(in srgb, var(--surface) 86%, var(--text)); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
    font: 16px/1.5 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 40px 24px; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo b { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-size: 26px; font-weight: 900; }
  .logo span { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  form { width: min(720px, 100%); display: flex; gap: 10px; }
  input { flex: 1; font: inherit; font-size: 20px; padding: 16px 22px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
  button.go { font: inherit; font-weight: 700; padding: 0 26px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-text); cursor: pointer; outline: none; }
  button.go:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
  .engine { color: var(--muted); font-size: 13px; margin-top: -30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; width: min(920px, 100%); }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; outline: none; text-decoration: none; }
  .tile:hover, .tile:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); transform: translateY(-2px); }
  .tile i { width: 48px; height: 48px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 18%, var(--bg)); color: var(--accent); display: grid; place-items: center; font: 700 20px/1 "Segoe UI"; }
  .tile span { font-size: 14px; text-align: center; }
  .hint { color: var(--muted); font-size: 12px; }
  kbd { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; }
</style>
</head>
<body>
  <div class="logo"><b>J</b><span>JOYCHROMIUM</span></div>
  <form id="search"><input id="q" autofocus placeholder="Search or type a web address" autocomplete="off"><button class="go" type="submit">GO</button></form>
  <div class="engine" id="engine"></div>
  <div class="grid" id="tiles"></div>
  <div class="hint"><kbd>Y</kbd> opens the controller keyboard · <kbd>D-pad</kbd> moves · <kbd>A</kbd> selects</div>
<script>
  const $ = id => document.getElementById(id);
  const post = (type, payload) => { try { window.chrome.webview.postMessage(JSON.stringify({ type, ...payload })); } catch (_) {} };
  $('search').addEventListener('submit', e => {
    e.preventDefault();
    const url = $('q').value.trim();
    if (url) post('navigate', { url });
  });
  window.chrome.webview.addEventListener('message', event => {
    const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
    if (msg.type !== 'init') return;
    const t = msg.theme, r = document.documentElement.style;
    r.setProperty('--accent', t.accent); r.setProperty('--bg', t.background); r.setProperty('--surface', t.surface); r.setProperty('--text', t.text);
    const v = parseInt(t.accent.slice(1), 16);
    r.setProperty('--accent-text', (0.2126 * (v >> 16 & 255) + 0.7152 * (v >> 8 & 255) + 0.0722 * (v & 255)) / 255 > 0.45 ? '#07120F' : '#FFFFFF');
    $('engine').textContent = `Searching with ${msg.searchEngine.name}`;
    $('tiles').replaceChildren(...msg.shortcuts.map(s => {
      const b = document.createElement('button');
      b.className = 'tile'; b.title = s.url;
      b.innerHTML = `<i>${s.name.trim()[0].toUpperCase()}</i><span>${s.name}</span>`;
      b.addEventListener('click', () => post('navigate', { url: s.url }));
      return b;
    }));
  });
  post('ready', {});
</script>
</body>
</html>
